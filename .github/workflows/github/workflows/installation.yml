name: Installation TURBOFUSION 3.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installation:
    runs-on: ubuntu-24.04

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executer l'installateur
        run: |
          python installer_turbofusion.py

      - name: Tester les composants
        run: |
          python -m py_compile \
            main.py \
            publish_data.py \
            collect_courses.py

          python -m unittest discover -s tests -v

      - name: Enregistrer les fichiers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            collect_courses.py \
            tests/test_collect_courses.py \
            .github/workflows/turbofusion.yml

          if git diff --cached --quiet; then
            echo "Aucune modification"
            exit 0
          fi

          git commit -m \
            "Installer collecte TURBOFUSION M1-M5"

          git push origin HEAD:main
