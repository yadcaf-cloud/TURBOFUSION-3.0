name: TURBOFUSION 3.0 - Controle automatique

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: read

concurrency:
  group: turbofusion-controle
  cancel-in-progress: false

jobs:
  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verifier le logiciel
        run: |
          python -m py_compile main.py
          python main.py --diagnostic

      - name: Verifier les donnees du site
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          fichier = Path("dashboard.json")
          if not fichier.is_file():
              raise SystemExit("dashboard.json absent")

          data = json.loads(fichier.read_text(
              encoding="utf-8"
          ))

          if not isinstance(data.get("courses"), list):
              raise SystemExit("Format courses invalide")

          print("TURBOFUSION 3.0 : controle OK")
          print("Courses :", len(data["courses"]))
          PY
          
