name: TURBOFUSION 3.0 - Intelligence M1 M5

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: turbofusion-production
  cancel-in-progress: false

jobs:
  analyse:
    name: Collecte PMU et moteurs M1-M5
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      TZ: Europe/Paris
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verifier les scripts
        run: |
          set -euo pipefail
          python -m py_compile \
            collecte_pmu.py \
            main.py \
            publish_data.py
          mkdir -p data

      - name: Collecter les courses PMU
        run: |
          set -euo pipefail
          rm -f data/courses.json
          python collecte_pmu.py

      - name: Verifier les donnees du jour
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo

          path = Path("data/courses.json")
          if not path.is_file():
              raise SystemExit(
                  "ERREUR : fichier courses.json absent"
              )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          if not isinstance(data, dict):
              raise SystemExit(
                  "ERREUR : format JSON invalide"
              )

          courses = data.get("courses")
          if not isinstance(courses, list) or not courses:
              raise SystemExit(
                  "ERREUR : aucune course collectee"
              )

          paris = ZoneInfo("Europe/Paris")
          today = datetime.now(paris).date()
          ids = set()

          for index, course in enumerate(courses, 1):
              if not isinstance(course, dict):
                  raise SystemExit(
                      f"Course {index} : format invalide"
                  )

              depart = course.get("depart")
              if not depart:
                  raise SystemExit(
                      f"Course {index} : depart absent"
                  )

              try:
                  dt = datetime.fromisoformat(
                      depart.replace("Z", "+00:00")
                  )
              except (ValueError, AttributeError):
                  raise SystemExit(
                      f"Course {index} : date invalide"
                  )

              if dt.tzinfo is None:
                  raise SystemExit(
                      f"Course {index} : fuseau absent"
                  )

              if dt.astimezone(paris).date() != today:
                  raise SystemExit(
                      f"Course {index} : mauvaise date"
                  )

              ident = (
                  course.get("id")
                  or course.get("course_id")
              )
              if ident is not None:
                  if str(ident) in ids:
                      raise SystemExit(
                          f"Course dupliquee : {ident}"
                      )
                  ids.add(str(ident))

          print(
              f"COLLECTE VALIDEE : {len(courses)} courses"
          )
          PY

      - name: Diagnostic M1 M2 M3 M4 M5
        run: |
          set -euo pipefail
          python main.py --diagnostic

      - name: Executer les cinq moteurs
        run: |
          set -euo pipefail
          rm -f data/publication_latest.json
          python main.py \
            --figer \
            --strict-input \
            --safety-minutes 2

      - name: Verifier les analyses
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/publication_latest.json")

          if not path.is_file():
              raise SystemExit(
                  "ERREUR : publication absente"
              )

          publication = json.loads(
              path.read_text(encoding="utf-8")
          )

          if not isinstance(publication, dict):
              raise SystemExit(
                  "ERREUR : publication invalide"
              )

          courses = publication.get("courses")

          if not isinstance(courses, list) or not courses:
              raise SystemExit(
                  "ERREUR : aucune analyse publiee"
              )

          actifs = 0

          for course in courses:
              if not isinstance(course, dict):
                  raise SystemExit(
                      "ERREUR : entree course invalide"
                  )

              statut = course.get("statut")

              if statut in (
                  "analyse_provisoire",
                  "fige",
                  "fige_existant"
              ):
                  actifs += 1
                  moteurs = course.get("moteurs")

                  if not isinstance(moteurs, dict):
                      raise SystemExit(
                          "ERREUR : moteurs absents"
                      )

                  for nom in (
                      "M1", "M2", "M3", "M4", "M5"
                  ):
                      if nom not in moteurs:
                          raise SystemExit(
                              f"ERREUR : {nom} absent"
                          )

                      if not isinstance(
                          moteurs[nom], dict
                      ):
                          raise SystemExit(
                              f"ERREUR : {nom} invalide"
                          )

          print(
              f"PUBLICATION VALIDEE : {len(courses)} courses"
          )
          print(f"ANALYSES ACTIVES : {actifs}")
          PY

      - name: Enregistrer les donnees
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "Aucune modification a publier"
            exit 0
          fi

          git commit -m \
            "Actualisation TURBOFUSION M1-M5"

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Bilan de fonctionnement
        if: always()
        run: |
          echo "## TURBOFUSION 3.0" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Collecte PMU et moteurs M1-M5" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Resultat : ${{ job.status }}" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "Heure Paris : $(TZ=Europe/Paris date)" \
            >> "$GITHUB_STEP_SUMMARY"
            
