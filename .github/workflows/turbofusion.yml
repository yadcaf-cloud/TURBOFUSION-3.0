name: TURBOFUSION 3.0 - Intelligence M1 M5

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: turbofusion-production
  cancel-in-progress: false

jobs:
  analyse:
    name: Intelligence hippique M1-M5
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verifier les programmes
        run: |
          python -m py_compile \
            main.py \
            publish_data.py \
            collecte_pmu.py

      - name: Collecter les courses PMU
        env:
          TURBOFUSION_SOURCE_URL: ${{ secrets.TURBOFUSION_SOURCE_URL }}
        run: |
          python collecte_pmu.py

      - name: Verifier les donnees du jour
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          with open("data/courses.json", encoding="utf-8") as f:
              data = json.load(f)

          courses = data.get("courses", [])
          assert courses, "Aucune course collectee"

          today = datetime.now(
              ZoneInfo("Europe/Paris")
          ).date()

          for course in courses:
              depart = datetime.fromisoformat(course["depart"])
              assert depart.tzinfo is not None
              assert depart.astimezone(
                  ZoneInfo("Europe/Paris")
              ).date() == today

          print("Courses validees :", len(courses))
          PY

      - name: Diagnostic M1 M2 M3 M4 M5
        run: python main.py --diagnostic

      - name: Executer les cinq moteurs
        run: |
          python main.py \
            --figer \
            --strict-input \
            --safety-minutes 2

      - name: Verifier les analyses
        run: |
          python - <<'PY'
          import json

          with open(
              "data/publication_latest.json",
              encoding="utf-8"
          ) as f:
              publication = json.load(f)

          courses = publication.get("courses", [])
          if not courses:
              raise SystemExit("Aucune analyse publiee")

          analyses = [
              c for c in courses
              if c.get("statut") in (
                  "analyse_provisoire",
                  "fige",
                  "fige_existant"
              )
          ]

          if not analyses:
              raise SystemExit(
                  "Aucune analyse exploitable"
              )

          for course in analyses:
              moteurs = course.get("moteurs", {})
              for nom in ("M1", "M2", "M3", "M4", "M5"):
                  if nom not in moteurs:
                      raise SystemExit(
                          "Moteur absent : " + nom
                      )

          print("Analyses controlees :", len(analyses))
          PY

      - name: Enregistrer les donnees
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if ! git diff --cached --quiet; then
            git commit -m "Actualisation TURBOFUSION M1-M5"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Bilan de fonctionnement
        if: always()
        run: |
          echo "TURBOFUSION 3.0"
          echo "Controle termine"
          echo "Consulter les etapes du workflow"
          
