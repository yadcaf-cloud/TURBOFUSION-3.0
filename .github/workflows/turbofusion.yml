name: TURBOFUSION 3.0 - M1 a M5

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

concurrency:
  group: turbofusion-production
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Diagnostic des moteurs
        run: |
          python -m py_compile main.py publish_data.py
          python main.py --diagnostic

      - name: Executer les analyses M1 a M5
        run: |
          set +e
          python main.py --figer --safety-minutes 2
          code=$?
          set -e

          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi

      - name: Verifier la publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/publication_latest.json")
          if not path.is_file():
              raise SystemExit("Publication absente")

          data = json.loads(path.read_text(
              encoding="utf-8"
          ))

          if not isinstance(data.get("courses"), list):
              raise SystemExit("Courses invalides")

          print("Publication valide")
          print("Courses :", len(data["courses"]))
          PY

      - name: Enregistrer les donnees et FIGES
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "Aucune modification"
          else
            git commit -m "Actualisation TURBOFUSION M1-M5"
            git push
          fi
