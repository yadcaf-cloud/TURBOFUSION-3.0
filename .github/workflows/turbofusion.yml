name: TURBOFUSION 3.0 - M1 a M5

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

concurrency:
  group: turbofusion-production
  cancel-in-progress: false

jobs:
  analyse:
    name: Analyse et publication M1-M5
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verifier le logiciel
        shell: bash
        run: |
          set -euo pipefail
          test -f main.py
          test -f publish_data.py
          test -f index.html
          python -m py_compile main.py publish_data.py

      - name: Proteger les cinq moteurs
        shell: bash
        run: |
          python - <<'PY'
          from main import WEIGHTS
          from publish_data import MOTEURS

          attendus = ("M1", "M2", "M3", "M4", "M5")

          assert tuple(WEIGHTS) == attendus
          assert tuple(MOTEURS) == attendus

          for nom, poids in WEIGHTS.items():
              assert len(poids) == 7, nom

          print("M1-M5 : configuration preservee")
          PY

      - name: Diagnostic de la collecte
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("data/courses.json")

          if not source.is_file():
              print("::warning::Collecte absente.")
              print("Aucun programme PMU disponible.")
          else:
              try:
                  donnees = json.loads(
                      source.read_text(encoding="utf-8")
                  )
                  courses = donnees.get("courses")
                  if not isinstance(courses, list):
                      raise ValueError("Liste courses invalide")

                  print("Courses recues :", len(courses))
                  if not courses:
                      print("::warning::Aucune course recue.")
              except (OSError, ValueError, TypeError) as exc:
                  print(f"::error::Donnees invalides : {exc}")
                  raise SystemExit(1)
          PY

      - name: Diagnostic des moteurs
        run: python main.py --diagnostic

      - name: Executer les analyses
        shell: bash
        run: |
          set +e
          python main.py --figer --safety-minutes 2
          code=$?
          set -e

          if [ "$code" -eq 2 ]; then
            echo "::warning::Aucune course verifiee."
          elif [ "$code" -ne 0 ]; then
            echo "::error::Echec du logiciel."
            exit "$code"
          fi

      - name: Controler la publication
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          audit_path = Path("data/audit_latest.json")
          publication_path = Path(
              "data/publication_latest.json"
          )

          if not audit_path.is_file():
              raise SystemExit("Audit absent")

          if not publication_path.is_file():
              raise SystemExit("Publication absente")

          audit = json.loads(
              audit_path.read_text(encoding="utf-8")
          )
          publication = json.loads(
              publication_path.read_text(encoding="utf-8")
          )

          if not isinstance(audit, dict):
              raise SystemExit("Audit invalide")
          if not isinstance(publication, dict):
              raise SystemExit("Publication invalide")

          courses = publication.get("courses")
          if not isinstance(courses, list):
              raise SystemExit("Courses invalides")

          moteurs = {"M1", "M2", "M3", "M4", "M5"}

          for course in courses:
              if not isinstance(course, dict):
                  raise SystemExit("Course invalide")
              valeurs = course.get("moteurs", {})
              if not isinstance(valeurs, dict):
                  raise SystemExit("Moteurs invalides")
              if not set(valeurs).issubset(moteurs):
                  raise SystemExit("Moteur inconnu")

          statuts = {
              "analyse_provisoire",
              "fige",
              "fige_existant",
          }

          verifiees = sum(
              c.get("statut") in statuts
              for c in courses
          )

          print("Courses publiees :", len(courses))
          print("Courses analysees :", verifiees)
          print(
              "Statut collecte :",
              audit.get("statut_collecte")
          )

          if verifiees == 0:
              print(
                  "::warning::Aucune analyse "
                  "de course verifiee."
              )
          PY

      - name: Enregistrer les donnees
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- data/

          if git diff --cached --quiet; then
            echo "Aucune modification"
            exit 0
          fi

          git commit -m "Actualisation TURBOFUSION M1-M5"

          for tentative in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Publication terminee"
              exit 0
            fi

            if [ "$tentative" -eq 3 ]; then
              echo "::error::Echec du push Git."
              exit 1
            fi

            sleep 5
          done
          
