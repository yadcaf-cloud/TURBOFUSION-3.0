name: TURBOFUSION 3.0 - M1 a M5

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: turbofusion-production
  cancel-in-progress: false

jobs:
  analyse:
    name: Collecte et analyse hippique
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      TZ: Europe/Paris
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verifier les scripts
        run: |
          set -euo pipefail
          python -m py_compile \
            collecte_pmu.py \
            main.py \
            publish_data.py
          mkdir -p data

      - name: Collecter les courses PMU
        run: |
          set -euo pipefail
          python collecte_pmu.py

      - name: Controler la collecte
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          p = Path("data/courses.json")
          if not p.is_file():
              raise SystemExit("Collecte absente")

          data = json.loads(p.read_text(encoding="utf-8"))
          courses = data.get("courses")

          if not isinstance(courses, list) or not courses:
              raise SystemExit("Aucune course collectee")

          today = datetime.now(
              ZoneInfo("Europe/Paris")
          ).date()

          ids = set()

          for course in courses:
              cid = course.get("id")
              if not cid or cid in ids:
                  raise SystemExit("Identifiant invalide")
              ids.add(cid)

              instant = datetime.fromisoformat(
                  course["depart"].replace("Z", "+00:00")
              )
              if instant.tzinfo is None:
                  raise SystemExit("Fuseau horaire absent")

              if instant.astimezone(
                  ZoneInfo("Europe/Paris")
              ).date() != today:
                  raise SystemExit("Date de course incorrecte")

          print(f"{len(courses)} courses controlees")
          PY

      - name: Diagnostic des moteurs
        run: |
          python main.py --diagnostic

      - name: Analyser et figer avant depart
        run: |
          set -euo pipefail
          python main.py \
            --figer \
            --strict-input \
            --safety-minutes 2

      - name: Controler la publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/publication_latest.json")
          if not p.is_file():
              raise SystemExit("Publication absente")

          data = json.loads(p.read_text(encoding="utf-8"))
          courses = data.get("courses")

          if not isinstance(courses, list):
              raise SystemExit("Publication invalide")

          for course in courses:
              if course.get("statut") in (
                  "fige", "fige_existant"
              ):
                  if not course.get("fichier_fige"):
                      raise SystemExit(
                          "Reference FIGE manquante"
                      )

          print("Publication controlee")
          PY

      - name: Publier les donnees et conserver les FIGES
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "Aucun changement"
            exit 0
          fi

          git commit -m \
            "Actualisation TURBOFUSION M1-M5"

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Rapport GitHub Actions
        if: always()
        run: |
          {
            echo "## TURBOFUSION 3.0"
            echo ""
            echo "Statut : ${{ job.status }}"
            echo ""
            echo "Heure Paris : $(TZ=Europe/Paris date)"
          } >> "$GITHUB_STEP_SUMMARY"
          
