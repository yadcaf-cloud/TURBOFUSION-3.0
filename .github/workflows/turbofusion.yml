name: TURBOFUSION 3.0 - M1 a M5

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

concurrency:
  group: turbofusion-production
  cancel-in-progress: false

jobs:
  analyse:
    name: Intelligence hippique M1-M5
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verifier les fichiers Python
        run: |
          set -e
          python -m py_compile main.py publish_data.py
          echo "Fichiers Python valides"

      - name: Controler la source des courses
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/courses.json")

          if not p.is_file():
              print("::warning::Source courses absente")
              print("Aucune course verifiee disponible")
          else:
              data = json.loads(
                  p.read_text(encoding="utf-8")
              )

              if not isinstance(data, dict):
                  raise SystemExit("Source invalide")

              courses = data.get("courses")

              if not isinstance(courses, list):
                  raise SystemExit("Format courses invalide")

              print("Courses disponibles :", len(courses))

              if not courses:
                  print("::warning::Liste des courses vide")
          PY

      - name: Diagnostic des moteurs M1 a M5
        run: |
          python main.py --diagnostic

      - name: Executer les analyses M1 a M5
        run: |
          set +e
          python main.py --figer --safety-minutes 2
          code=$?
          set -e

          if [ "$code" -eq 2 ]; then
            echo "::warning::Collecte en attente ou aucune course"
          elif [ "$code" -ne 0 ]; then
            echo "::error::Echec de l'analyse"
            exit "$code"
          fi

      - name: Verifier la publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/publication_latest.json")

          if not path.is_file():
              raise SystemExit("Publication absente")

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          if not isinstance(data, dict):
              raise SystemExit("Publication invalide")

          courses = data.get("courses")

          if not isinstance(courses, list):
              raise SystemExit("Courses invalides")

          print("Publication valide")
          print("Courses publiees :", len(courses))
          print(
              "Etat collecte :",
              data.get("statut_collecte", "inconnu")
          )
          PY

      - name: Enregistrer les donnees et FIGES
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "Aucune modification"
          else
            git commit -m "Actualisation TURBOFUSION M1-M5"
            git push
          fi

      - name: Resume du fonctionnement
        if: always()
        run: |
          echo "================================"
          echo "TURBOFUSION 3.0"
          echo "Intelligence hippique M1 a M5"
          echo "================================"
          echo "Controle GitHub Actions termine"
          echo "Consulter les etapes precedentes"
          echo "pour connaitre le resultat exact"
