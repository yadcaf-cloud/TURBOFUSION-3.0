name: TURBOFUSION 3.0 - Analyse controlee

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

concurrency:
  group: turbofusion-production
  cancel-in-progress: false

jobs:
  analyser:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verifier les fichiers Python
        run: |
          python -m py_compile main.py
          python -m py_compile collecte_pmu.py
          python -m py_compile publish_data.py

      - name: Diagnostic des moteurs M1-M5
        run: |
          python main.py --diagnostic

      - name: Controle de la collecte PMU
        id: collecte
        shell: bash
        run: |
          if python collecte_pmu.py; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Collecte indisponible."
          fi

      - name: Analyse M1-M5 et FIGE
        if: steps.collecte.outputs.ready == 'true'
        run: |
          python main.py \
            --figer \
            --strict-input \
            --safety-minutes 2

      - name: Publication des donnees
        if: steps.collecte.outputs.ready == 'true'
        run: |
          python publish_data.py

      - name: Enregistrer les archives
        if: steps.collecte.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/courses.json \
            data/publication_latest.json \
            data/figes/ || true

          if ! git diff --cached --quiet; then
            git commit -m "TURBOFUSION: publication et archives controlees"
            git push
          fi
