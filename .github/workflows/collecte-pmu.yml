
name: TURBOFUSION - Collecte PMU

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: turbofusion-collecte-pmu
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collecter les courses PMU
        run: python collecte_pmu.py

      - name: Verifier le fichier JSON
        run: |
          python -m json.tool \
            data/publication_latest.json > /dev/null

      - name: Publier les donnees
        run: |
          git config user.name "turbofusion-bot"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/publication_latest.json

          if git diff --cached --quiet; then
            echo "Aucun changement"
            exit 0
          fi

          git commit -m "PMU: actualisation automatique"

          for tentative in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Publication reussie"
              exit 0
            fi
            sleep 5
          done

          echo "Echec de publication"
          exit 1
