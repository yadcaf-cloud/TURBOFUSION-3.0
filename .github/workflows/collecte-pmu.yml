name: TURBOFUSION - Collecte PMU

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: turbofusion-collecte-pmu
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preparer le dossier des donnees
        run: mkdir -p data

      - name: Collecter les courses PMU
        env:
          TZ: Europe/Paris
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python collecte_pmu.py

      - name: Verifier les donnees JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          fichier = Path("data/publication_latest.json")

          if not fichier.is_file():
              raise SystemExit(
                  "ERREUR : publication_latest.json absent"
              )

          if fichier.stat().st_size == 0:
              raise SystemExit(
                  "ERREUR : fichier JSON vide"
              )

          with fichier.open(
              encoding="utf-8"
          ) as f:
              donnees = json.load(f)

          if not isinstance(donnees, (dict, list)):
              raise SystemExit(
                  "ERREUR : structure JSON inattendue"
              )

          if not donnees:
              raise SystemExit(
                  "ERREUR : aucune donnee collectee"
              )

          print("JSON valide et non vide")
          PY

      - name: Publier les donnees
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/publication_latest.json

          if git diff --cached --quiet; then
            echo "Aucun changement a publier"
            exit 0
          fi

          git commit -m "PMU: actualisation automatique"

          for tentative in 1 2 3; do
            echo "Tentative $tentative"

            if ! git fetch origin main; then
              echo "Echec de recuperation distante"
              sleep 5
              continue
            fi

            if ! git rebase origin/main; then
              echo "Conflit Git : publication interrompue"
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Publication reussie"
              exit 0
            fi

            echo "Nouvelle tentative dans 5 secondes"
            sleep 5
          done

          echo "ERREUR : echec de publication"
          exit 1
