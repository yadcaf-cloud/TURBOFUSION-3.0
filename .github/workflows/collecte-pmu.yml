name: TURBOFUSION 3.0 - Collecte PMU

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: turbofusion-collecte-pmu
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            echo "Aucun requirements.txt trouve"
            echo "Installation externe ignoree"
          fi

      - name: Verifier le programme
        run: |
          set -euo pipefail
          test -f collecte_pmu.py || {
            echo "ERREUR : collecte_pmu.py absent"
            exit 1
          }
          python -m py_compile collecte_pmu.py

      - name: Preparer les donnees
        run: |
          mkdir -p data

      - name: Collecter les courses PMU
        env:
          TZ: Europe/Paris
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python collecte_pmu.py

      - name: Verifier les donnees JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          fichier = Path("data/publication_latest.json")

          if not fichier.is_file():
              raise SystemExit("ERREUR : JSON absent")

          if fichier.stat().st_size == 0:
              raise SystemExit("ERREUR : JSON vide")

          with fichier.open(encoding="utf-8") as f:
              donnees = json.load(f)

          if not isinstance(donnees, (dict, list)):
              raise SystemExit("ERREUR : JSON invalide")

          if not donnees:
              raise SystemExit("ERREUR : aucune donnee")

          print("Verification JSON reussie")
          PY

      - name: Publier les donnees
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/publication_latest.json

          if git diff --cached --quiet; then
            echo "Aucune modification a publier"
            exit 0
          fi

          git commit -m "TURBOFUSION: collecte PMU"

          for tentative in 1 2 3; do
            echo "Publication tentative $tentative"

            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "ERREUR : conflit Git"
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Publication reussie"
              exit 0
            fi

            sleep 5
          done

          echo "ERREUR : publication impossible"
          exit 1
          
